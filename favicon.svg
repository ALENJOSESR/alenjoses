<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#55e7ff"/>
      <stop offset="48%"  stop-color="#b55cff"/>
      <stop offset="100%" stop-color="#50ffb1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="9" fill="#05070d"/>

  <!-- Inner glow -->
  <ellipse cx="16" cy="16" rx="12" ry="12" fill="url(#g)" opacity="0.13"/>

  <!-- Gradient border -->
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="8.4" fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.55"/>

  <!-- AJ monogram -->
  <text
    x="4.5" y="23"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="16.5"
    font-weight="900"
    letter-spacing="-1"
    fill="url(#g)"
  >AJ</text>
</svg>
